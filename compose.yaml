services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluent
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fluent-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluent"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ${API_CONTEXT:-../fluent-api}
      dockerfile: Dockerfile.dev
    ports:
      - "${API_PORT:-9999}:9999"
    volumes:
      - ${API_CONTEXT:-../fluent-api}:/app
      - /app/node_modules
    env_file: ${API_CONTEXT:-../fluent-api}/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fluent
    command: sh docker-entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ${API_CONTEXT:-../fluent-api}
      dockerfile: Dockerfile.dev
    volumes:
      - ${API_CONTEXT:-../fluent-api}:/app
      - /app/node_modules
    env_file: ${API_CONTEXT:-../fluent-api}/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fluent
    command: npx tsx watch src/workers/standalone-worker.ts
    depends_on:
      api:
        condition: service_healthy

  ai:
    build:
      context: ${AI_CONTEXT:-../fluent-ai}
      dockerfile: Dockerfile.dev
    ports:
      - "${AI_PORT:-8888}:8888"
    volumes:
      - ${AI_CONTEXT:-../fluent-ai}:/app
      - /app/node_modules
    env_file: ${AI_CONTEXT:-../fluent-ai}/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fluent
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ${WEB_CONTEXT:-../fluent-web}
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ${WEB_CONTEXT:-../fluent-web}:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "http://localhost:${API_PORT:-9999}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fluent-pgdata:
