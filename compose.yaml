services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluent
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fluent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluent"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ${API_CONTEXT:-../fluent-api}
      dockerfile: Dockerfile.dev
    ports:
      - "${API_PORT:-9999}:9999"
    volumes:
      - ${API_CONTEXT:-../fluent-api}/src:/app/src:ro
      - ${API_CONTEXT:-../fluent-api}/scripts:/app/scripts:ro
      - ${API_CONTEXT:-../fluent-api}/tsconfig.json:/app/tsconfig.json:ro
      - ${API_CONTEXT:-../fluent-api}/drizzle.config.ts:/app/drizzle.config.ts:ro
      - ${API_CONTEXT:-../fluent-api}/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - fluent-api-node-modules:/app/node_modules
    env_file: ${API_CONTEXT:-../fluent-api}/.env
    environment:
      BOOTSTRAP_DATABASE_URL: postgres://postgres:postgres@db:5432/fluent
      MIGRATIONS_DATABASE_URL: postgres://api_migrator:password@db:5432/fluent
      DATABASE_URL: postgres://api_user:password@db:5432/fluent
      EXPORTS_DIR: /app/exports
      # fluent-ai is reachable by service name on the shared compose network.
      # Override here so ecosystem mode works regardless of the standalone
      # value in fluent-api/.env (which targets http://localhost:8200).
      # FLUENT_AI_KEY is intentionally NOT overridden — it is a shared secret
      # sourced from fluent-api/.env so the caller key and fluent-ai's
      # ai_api_keys seed stay in lockstep. See fluent-api proposal §12.4 / D12.
      FLUENT_AI_URL: http://ai:8200
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.cache:noexec,nosuid,size=128m
      - /app/exports:noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ${API_CONTEXT:-../fluent-api}
      dockerfile: Dockerfile.dev
    volumes:
      - ${API_CONTEXT:-../fluent-api}/src:/app/src:ro
      - ${API_CONTEXT:-../fluent-api}/tsconfig.json:/app/tsconfig.json:ro
      - fluent-worker-node-modules:/app/node_modules
    env_file: ${API_CONTEXT:-../fluent-api}/.env
    environment:
      BOOTSTRAP_DATABASE_URL: postgres://postgres:postgres@db:5432/fluent
      MIGRATIONS_DATABASE_URL: postgres://api_migrator:password@db:5432/fluent
      DATABASE_URL: postgres://api_user:password@db:5432/fluent
      EXPORTS_DIR: /app/exports
    command: ["dumb-init", "--", "npx", "tsx", "watch", "src/workers/standalone-worker.ts"]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.cache:noexec,nosuid,size=128m
      - /app/exports:noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy

  ai:
    build:
      context: ${AI_CONTEXT:-../fluent-ai}
      dockerfile: Dockerfile.dev
    ports:
      - "${AI_PORT:-8200}:8200"
    volumes:
      - ${AI_CONTEXT:-../fluent-ai}/src:/app/src:ro
      - ${AI_CONTEXT:-../fluent-ai}/scripts:/app/scripts:ro
      - ${AI_CONTEXT:-../fluent-ai}/tests:/app/tests:ro
      - ${AI_CONTEXT:-../fluent-ai}/pyproject.toml:/app/pyproject.toml:ro
      - ${AI_CONTEXT:-../fluent-ai}/uv.lock:/app/uv.lock:ro
      - ${AI_CONTEXT:-../fluent-ai}/alembic.ini:/app/alembic.ini:ro
      - ${AI_CONTEXT:-../fluent-ai}/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - fluent-ai-logs:/app/logs
    env_file: ${AI_CONTEXT:-../fluent-ai}/.env
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql://postgres:postgres@db:5432/fluent
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://ai_migrator:password@db:5432/fluent
      DATABASE_URL: postgresql+asyncpg://ai_user:password@db:5432/fluent
      ENVIRONMENT: development
      DEBUG: "true"
      # The default fluent-ai value (/app/.cache/uv) lands on the noexec tmpfs
      # mounted at /app/.cache below, so uv fails to initialize its cache
      # ("Permission denied"). Point it at the writable /tmp tmpfs instead.
      UV_CACHE_DIR: /tmp/.uv-cache
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:nosuid,size=256m
      - /app/.cache:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ${WEB_CONTEXT:-../fluent-web}
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ${WEB_CONTEXT:-../fluent-web}/src:/app/src
      - ${WEB_CONTEXT:-../fluent-web}/public:/app/public:ro
      - ${WEB_CONTEXT:-../fluent-web}/index.html:/app/index.html:ro
      - ${WEB_CONTEXT:-../fluent-web}/vite.config.ts:/app/vite.config.ts
      - ${WEB_CONTEXT:-../fluent-web}/tsconfig.json:/app/tsconfig.json:ro
      - ${WEB_CONTEXT:-../fluent-web}/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ${WEB_CONTEXT:-../fluent-web}/components.json:/app/components.json:ro
      - ${WEB_CONTEXT:-../fluent-web}/eslint.config.js:/app/eslint.config.js:ro
      - ${WEB_CONTEXT:-../fluent-web}/.prettierrc.js:/app/.prettierrc.js:ro
      - ${WEB_CONTEXT:-../fluent-web}/.prettierignore:/app/.prettierignore:ro
      - ${WEB_CONTEXT:-../fluent-web}/.env:/app/.env:ro
      - fluent-web-node-modules:/app/node_modules
      - fluent-web-eslintcache:/app/.eslintcache
    environment:
      COREPACK_HOME: /app/.cache/corepack
      COREPACK_ENABLE_AUTO_PIN: "0"
    user: "1001:1001"
    tmpfs:
      - /tmp:nosuid,size=64m
      - /app/.cache:noexec,nosuid,uid=1001,gid=1001,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy

volumes:
  fluent-pgdata:
  fluent-api-node-modules:
  fluent-worker-node-modules:
  fluent-web-node-modules:
  fluent-ai-logs:
  fluent-web-eslintcache:
