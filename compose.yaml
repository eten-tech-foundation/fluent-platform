services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluent
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fluent-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluent"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ${API_CONTEXT:-../fluent-api}
      dockerfile: Dockerfile.dev
    ports:
      - "${API_PORT:-9999}:9999"
    volumes:
      - ${API_CONTEXT:-../fluent-api}/src:/app/src:ro
      - ${API_CONTEXT:-../fluent-api}/tsconfig.json:/app/tsconfig.json:ro
      - ${API_CONTEXT:-../fluent-api}/drizzle.config.ts:/app/drizzle.config.ts:ro
      - ${API_CONTEXT:-../fluent-api}/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - /app/node_modules
    env_file: ${API_CONTEXT:-../fluent-api}/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fluent
      EXPORTS_DIR: /app/exports
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.cache:noexec,nosuid,size=128m
      - /app/exports:noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ${API_CONTEXT:-../fluent-api}
      dockerfile: Dockerfile.dev
    volumes:
      - ${API_CONTEXT:-../fluent-api}/src:/app/src:ro
      - ${API_CONTEXT:-../fluent-api}/tsconfig.json:/app/tsconfig.json:ro
      - /app/node_modules
    env_file: ${API_CONTEXT:-../fluent-api}/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fluent
      EXPORTS_DIR: /app/exports
    command: ["dumb-init", "--", "npx", "tsx", "watch", "src/workers/standalone-worker.ts"]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.cache:noexec,nosuid,size=128m
      - /app/exports:noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy

  ai:
    build:
      context: ${AI_CONTEXT:-../fluent-ai}
      dockerfile: Dockerfile.dev
    ports:
      - "${AI_PORT:-8200}:8200"
    volumes:
      - ${AI_CONTEXT:-../fluent-ai}/src:/app/src:ro
      - ${AI_CONTEXT:-../fluent-ai}/pyproject.toml:/app/pyproject.toml:ro
      - ${AI_CONTEXT:-../fluent-ai}/uv.lock:/app/uv.lock:ro
      - ${AI_CONTEXT:-../fluent-ai}/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    env_file: ${AI_CONTEXT:-../fluent-ai}/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/fluent"
      ENVIRONMENT: development
      DEBUG: "true"
      UV_CACHE_DIR: /app/.cache/uv
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:nosuid,size=64m
      - /app/.cache:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ${WEB_CONTEXT:-../fluent-web}
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ${WEB_CONTEXT:-../fluent-web}:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "http://localhost:${API_PORT:-9999}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fluent-pgdata:
